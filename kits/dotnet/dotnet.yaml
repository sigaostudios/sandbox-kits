# syntax=docker/sandbox-kit:3.0.0-m.8@sha256:e6a397771e865625047cf84256a914c7974b3e749d858259b5bc9c653ddb6f0d
schemaVersion: '3'
kind: mixin
displayName: .NET SDK
description: .NET SDK ${{ kit.args.version }} is isolated under /opt/sandbox-kits/dotnet; DOTNET_ROOT selects it.
args:
  version:
    default: 10.0.401
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    buildArg: DOTNET_VERSION
provides:
- dotnet-sdk@${{ kit.args.version }}
requires:
- native-dependencies >= 2026.10.2
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.nuget.org
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - user: '0'
      env:
      - DOTNET_ROOT
      command: |
        set -eu
        . /etc/os-release
        [ "$ID:$VERSION_ID:$(uname -m)" = debian:13:x86_64 ] || { echo 'This kit requires Debian 13 linux/amd64' >&2; exit 1; }
        test -r /usr/share/sandbox-kits/native-dependencies.installed || { echo 'Select the matching common dependency mixin' >&2; exit 1; }
        test -z "$(dpkg --audit)"
        ln -sfn "$DOTNET_ROOT/dotnet" /usr/local/bin/dotnet
        [ "$(readlink -f "$(command -v dotnet)")" = "$DOTNET_ROOT/dotnet" ] || { echo 'Selected dotnet is shadowed on PATH' >&2; exit 1; }
        dotnet --version
- type: com.docker.sandbox/agent-context@1
  config:
    content: |-
      .NET SDK ${{ kit.args.version }} is isolated under /opt/sandbox-kits/dotnet; DOTNET_ROOT selects it.
      Public NuGet restore is permitted. Private feeds need project-owned access.
dockerfile: dotnet.dockerfile
