# syntax=docker/sandbox-kit:3.0.0-m.8@sha256:e6a397771e865625047cf84256a914c7974b3e749d858259b5bc9c653ddb6f0d
schemaVersion: '3'
kind: mixin
version: 2026.10.9
displayName: Playwright and Electron
description: Debian 13 amd64 native libraries support Chromium and Electron, with Xvfb and xauth.
provides:
- chromium-electron-native
requires:
- node
- native-dependencies >= 2026.10.2
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - storage.googleapis.com
      - github.com
      - release-assets.githubusercontent.com
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - user: '0'
      command: |
        set -eu
        . /etc/os-release
        [ "$ID:$VERSION_ID:$(uname -m)" = debian:13:x86_64 ] || { echo 'This kit requires Debian 13 linux/amd64' >&2; exit 1; }
        test -r /usr/share/sandbox-kits/native-dependencies.installed || { echo 'Select the matching common dependency mixin' >&2; exit 1; }
        test -z "$(dpkg --audit)"
- type: com.docker.sandbox/agent-context@1
  config:
    content: |-
      Debian 13 amd64 native libraries support Chromium and Electron, with Xvfb and xauth.
      Browser/Electron versions and binaries remain project-managed; download endpoints are permitted.
      No desktop display is provided, so use xvfb-run -a for headed Chromium or Electron.
      Firefox and WebKit are outside this kit's tested support.
