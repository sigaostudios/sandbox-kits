# syntax=docker/sandbox-kit:3.0.0-m.8@sha256:e6a397771e865625047cf84256a914c7974b3e749d858259b5bc9c653ddb6f0d
schemaVersion: '3'
kind: mixin
displayName: Aspire CLI
description: Aspire CLI ${{ kit.args.version }} is isolated under /opt/sandbox-kits/aspire; ASPIRE_ROOT selects it.
args:
  version:
    default: 13.6.1
    pattern: ^13\.[0-9]+\.[0-9]+$
    buildArg: ASPIRE_VERSION
provides:
- aspire-cli@${{ kit.args.version }}
requires:
- dotnet-sdk >= 10.0.0
- native-dependencies >= 2026.10.2
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - aspire.dev
      - ci.dot.net
      - builds.dotnet.microsoft.com
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - user: '0'
      env:
      - ASPIRE_ROOT
      command: |
        set -eu
        . /etc/os-release
        [ "$ID:$VERSION_ID:$(uname -m)" = debian:13:x86_64 ] || { echo 'This kit requires Debian 13 linux/amd64' >&2; exit 1; }
        test -r /usr/share/sandbox-kits/native-dependencies.installed || { echo 'Select the matching common dependency mixin' >&2; exit 1; }
        test -z "$(dpkg --audit)"
        ln -sfn "$ASPIRE_ROOT/aspire" /usr/local/bin/aspire
        [ "$(readlink -f "$(command -v aspire)")" = "$ASPIRE_ROOT/aspire" ] || { echo 'Selected aspire is shadowed on PATH' >&2; exit 1; }
    - user: '1000'
      command: |
        set -eu
        aspire --version
- type: com.docker.sandbox/agent-context@1
  config:
    content: |-
      Aspire CLI ${{ kit.args.version }} is installed under /opt/sandbox-kits/aspire; ASPIRE_ROOT selects it.
      .NET SDK 10 or newer and the matching common native-dependency mixin are required.
      Aspire and .NET download endpoints are permitted. Application container registries, private feeds, credentials and published ports belong to the project environment.
dockerfile: aspire.dockerfile
