# syntax=docker/sandbox-kit:3.0.0-m.8@sha256:e6a397771e865625047cf84256a914c7974b3e749d858259b5bc9c653ddb6f0d
schemaVersion: '3'
kind: mixin
displayName: Node.js and Corepack
description: Node ${{ kit.args.version }} and Corepack ${{ kit.args.corepackVersion }} are isolated under /opt/sandbox-kits/node.
  Native addon build tools are supplied by the matching common dependency mixin.
args:
  version:
    default: 24.7.0
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    buildArg: NODE_VERSION
  corepackVersion:
    default: 0.34.7
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    buildArg: COREPACK_VERSION
provides:
- node@${{ kit.args.version }}
- corepack@${{ kit.args.corepackVersion }}
requires:
- native-dependencies >= 2026.10.2
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - registry.npmjs.org
      - nodejs.org
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - user: '0'
      env:
      - NODE_ROOT
      - NPM_CONFIG_PREFIX
      - npm_config_prefix
      command: |
        set -eu
        . /etc/os-release
        [ "$ID:$VERSION_ID:$(uname -m)" = debian:13:x86_64 ] || { echo 'This kit requires Debian 13 linux/amd64' >&2; exit 1; }
        test -r /usr/share/sandbox-kits/native-dependencies.installed || { echo 'Select the matching common dependency mixin' >&2; exit 1; }
        test -z "$(dpkg --audit)"
        # Do not replace the workload's npm prefix or its globally installed agent.
        for tool in node npm npx corepack pnpm pnpx yarn yarnpkg; do
          ln -sfn "$NODE_ROOT/bin/$tool" "/usr/local/bin/$tool"
        done
        hash -r
        for tool in node npm npx corepack pnpm; do
          [ "$(readlink -f "$(command -v "$tool")")" = "$(readlink -f "$NODE_ROOT/bin/$tool")" ] || { echo "Selected $tool is shadowed on PATH" >&2; exit 1; }
        done
        node --version
        corepack --version
- type: com.docker.sandbox/agent-context@1
  config:
    content: |-
      Node ${{ kit.args.version }} and Corepack ${{ kit.args.corepackVersion }} are isolated under /opt/sandbox-kits/node. Native addon build tools are supplied by the matching common dependency mixin.
      The project packageManager field selects pnpm; use pnpm without activating another global version.
      Public npm packages and Node headers are permitted.
dockerfile: node.dockerfile
